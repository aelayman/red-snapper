name: Build

# Runs on every push to main and every pull request, so a breaking change
# gets caught automatically before (or right after) it merges.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # WPF/WinForms apps can only be built on Windows.
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build RedSnapper.csproj -c Release
